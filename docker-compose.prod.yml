services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=256M
      - --max-connections=50
    environment:
      MYSQL_DATABASE: live_group_buy
      MYSQL_USER: app
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 96m

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m
      DB_URL: jdbc:mysql://mysql:3306/live_group_buy?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: app
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: http://${PUBLIC_HOST}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      SWEET_TRACKER_API_KEY: ${SWEET_TRACKER_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-disabled}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-disabled}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-disabled}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-disabled}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-disabled}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-disabled}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 640m

  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: http://${PUBLIC_HOST}
        NEXT_PUBLIC_RTMP_URL: rtmp://${PUBLIC_HOST}:1935
        NEXT_PUBLIC_HLS_URL: http://${PUBLIC_HOST}:8888
        NEXT_PUBLIC_WS_URL: ws://${PUBLIC_HOST}
        NEXT_PUBLIC_TOSS_CLIENT_KEY: ${NEXT_PUBLIC_TOSS_CLIENT_KEY:-}
    restart: unless-stopped
    depends_on:
      - backend
    mem_limit: 256m

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    mem_limit: 64m

  mediamtx:
    image: bluenviron/mediamtx:1
    profiles: ["live"]
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
      - "8189:8189/udp"
    mem_limit: 128m

volumes:
  mysql-data:
  redis-data:
