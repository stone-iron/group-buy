spring.application.name=live-group-buy-backend
server.port=8080

# Keep issued keys in backend/.env.properties (ignored by Git) or environment variables.
spring.config.import=optional:file:.env.properties,optional:file:backend/.env.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/live_group_buy?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Purchase queue: process waiting tickets in order and hold stock for 5 minutes.
purchase.queue.process-delay-ms=450
purchase.queue.reservation-seconds=300
purchase.queue.max-per-member=3

# Limited-sale abuse protection. Redis rate limiting fails open; DB stock locking remains authoritative.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=300ms
spring.data.redis.timeout=300ms
spring.data.redis.repositories.enabled=false
purchase.abuse.rate-limit.enabled=${PURCHASE_RATE_LIMIT_ENABLED:true}
purchase.abuse.rate-limit.user-per-second=3
purchase.abuse.rate-limit.ip-per-second=20
purchase.abuse.penalty.window-hours=24
purchase.abuse.penalty.block-threshold=3
purchase.abuse.penalty.block-minutes=30
purchase.abuse.penalty.severe-threshold=5
purchase.abuse.penalty.severe-block-hours=24

# Toss Payments: keep the secret key on the backend only.
payment.toss.secret-key=${TOSS_SECRET_KEY:}
payment.toss.base-url=${TOSS_BASE_URL:https://api.tosspayments.com}

server.error.include-message=always

# SmartTracker delivery tracking API
delivery.tracking.api-key=${SWEET_TRACKER_API_KEY:}
delivery.tracking.base-url=${SWEET_TRACKER_BASE_URL:https://info.sweettracker.co.kr}

# Social login
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID:}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET:}
spring.security.oauth2.client.registration.naver.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.naver.scope=name,email
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response
