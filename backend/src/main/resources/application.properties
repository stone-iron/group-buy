spring.application.name=live-group-buy-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/live_group_buy?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
